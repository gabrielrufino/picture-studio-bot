services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picture-studio-bot
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8
    container_name: picture-studio-mongo
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: picture_studio
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
